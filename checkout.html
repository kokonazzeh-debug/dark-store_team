<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب — دارك ستور</title>
  <meta name="description" content="إتمام طلب الشحن بسهولة وأمان في دارك ستور">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="announce" id="announcement">عروض جديدة يومياً - اشحن الآن بأفضل الأسعار! 🔥</div>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-badge">🎮</span> <span>دارك ستور<small>GAME TOP-UP</small></span></a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="misc.back">الرئيسية</a>
        <a href="index.html#games" data-i18n="nav.games">الألعاب</a>
        <a href="index.html#flash" data-i18n="nav.offers">العروض</a>
      </div>
      <div class="nav-actions">
        <button class="btn-icon lang-btn" id="langBtn">English</button>
        <button class="btn-icon cart-btn" onclick="openCart()" aria-label="السلة">🛒 <span class="cart-count" style="display:none">0</span></button>
        <button class="btn-icon hamburger" aria-label="القائمة">☰</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <nav class="breadcrumb"><a href="index.html" data-i18n="misc.back">الرئيسية</a> ← <span data-i18n="checkout.title">إتمام الطلب</span></nav>
    <div class="page-title">
      <h1 data-i18n="checkout.title">إتمام الطلب</h1>
      <p data-i18n="checkout.sub">خطوتين فقط وتكون شحنتك جاهزة</p>
    </div>

    <div class="checkout-grid">
      <div>
        <div class="panel">
          <h3><span class="num">1</span> <span data-i18n="checkout.s1">بيانات التواصل</span></h3>
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="checkout.name">الاسم الكامل</label>
              <input id="cName" type="text" placeholder="Ahmed Mohamed">
            </div>
            <div class="form-group">
              <label data-i18n="checkout.phone">رقم الهاتف</label>
              <input id="cPhone" type="tel" placeholder="01xxxxxxxxx">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="checkout.city">المحافظة</label>
              <select id="cCity">
                <option value="">—</option>
                <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option>
                <option>الدقهلية</option><option>الشرقية</option><option>الغربية</option>
                <option>المنوفية</option><option>المنيا</option><option>أسيوط</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="checkout.addr">العنوان بالتفصيل</label>
              <input id="cAddr" type="text" placeholder="الشارع، رقم العمارة، الدور">
            </div>
          </div>
        </div>

        <div class="panel">
          <h3><span class="num">2</span> <span data-i18n="checkout.s2">طريقة الدفع</span></h3>
          <div class="pay-methods" id="payMethods">
            <label class="pay-method active">
              <span class="picon">💵</span>
              <span><b data-i18n="checkout.pay.cash">الدفع عند الاستلام</b><span data-i18n="checkout.pay.cashSub">ادفع كاش عند استلام الطلب</span></span>
              <span class="radio"></span>
            </label>
            <label class="pay-method">
              <span class="picon">💳</span>
              <span><b data-i18n="checkout.pay.card">بطاقة ائتمان / خصم</b><span data-i18n="checkout.pay.cardSub">فيزا، ماستركارد (مشفر 100%)</span></span>
              <span class="radio"></span>
            </label>
            <label class="pay-method">
              <span class="picon">📱</span>
              <span><b data-i18n="checkout.pay.wallet">محفظة إلكترونية</b><span data-i18n="checkout.pay.walletSub">فودافون كاش / أورنج موني</span></span>
              <span class="radio"></span>
            </label>
          </div>
          <div id="cardFields" style="display:none" class="mt-3">
            <div class="form-row">
              <div class="form-group"><label>Card number</label><input id="cCard" type="text" placeholder="0000 0000 0000 0000"></div>
              <div class="form-group"><label>Name on card</label><input id="cCardName" type="text" placeholder="Ahmed M"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Expiry</label><input id="cCardExp" type="text" placeholder="MM/YY"></div>
              <div class="form-group"><label>CVV</label><input id="cCardCvv" type="password" placeholder="•••"></div>
            </div>
          </div>
          <div id="walletFields" style="display:none" class="mt-3">
            <div class="form-group"><label data-i18n="checkout.phone">رقم الهاتف</label><input id="cWallet" type="tel" placeholder="01xxxxxxxxx"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h3>🧾 <span data-i18n="checkout.summary">ملخص الشحن</span></h3>
          <div class="summary-list"><div class="checkout-items"></div></div>
          <div class="coupon">
            <input id="couponInput" type="text" data-i18n-ph="checkout.coupon" placeholder="كود الخصم">
            <button class="btn btn-ghost" id="couponBtn" data-i18n="checkout.couponBtn">تطبيق</button>
          </div>
          <div class="sum-row"><span data-i18n="checkout.subtotal">المجموع الفرعي</span><b id="subTotal"></b></div>
          <div class="sum-row"><span data-i18n="checkout.ship">التوصيل</span><b data-i18n="checkout.shipFree">مجاني</b></div>
          <div class="sum-row" id="discRow" style="display:none;color:var(--accent)"><span data-i18n="checkout.discount">الخصم</span><b id="discVal"></b></div>
          <div class="sum-row total"><span data-i18n="checkout.total">الإجمالي</span><b id="grandTotal"></b></div>
          <button class="btn btn-primary btn-lg" style="width:100%" id="placeOrderBtn" data-i18n="checkout.place">تأكيد الطلب ✓</button>
          <p style="font-size:12px;color:var(--text-3);text-align:center;margin-top:12px" data-i18n="checkout.secure">🔒 بياناتك آمنة ومشفرة بالكامل</p>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head"><h3>🛒 <span data-i18n="cart.title">سلة الشحن</span></h3><button class="btn-icon" onclick="closeCart()">✕</button></div>
    <div class="drawer-body"></div>
    <div class="drawer-foot"></div>
  </aside>

  <button id="backTop" aria-label="الصعود للأعلى">↑</button>
  <div class="toasts"></div>

  <script src="config/data.js"></script>
  <script src="config/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
