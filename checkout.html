<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دارك ستور — إتمام الطلب</title>
  <meta name="description" content="أكمل بياناتك واختر طريقة الدفع لإتمام طلب الشحن في دارك ستور.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a> /
        <span data-i18n="nav.cart"></span> /
        <span data-i18n="check.title"></span>
      </nav>
      <div class="page-title">
        <h1 data-i18n="check.title"></h1>
        <p data-i18n="check.sub"></p>
      </div>

      <div id="checkRoot"></div>
    </div>
  </main>

  <div id="appFooter"></div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="السلة">
    <div class="drawer-head"><h3>🛒 <span data-i18n="cart.title"></span></h3><button class="btn-icon modal-close" onclick="closeCart()" aria-label="إغلاق">✕</button></div>
    <div class="drawer-body"></div>
    <div class="drawer-foot"></div>
  </aside>

  <div class="modal-backdrop" id="adminModal">
    <div class="modal admin-login-card">
      <button class="btn-icon modal-close" data-close="adminModal" aria-label="إغلاق">✕</button>
      <span class="lock">🛡️</span>
      <h1 data-i18n="a.login"></h1>
      <p data-i18n="a.loginSub"></p>
      <div class="field">
        <label for="adminPassInput" data-i18n="a.password"></label>
        <input class="input" id="adminPassInput" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="adminLoginBtn" data-i18n="a.enter"></button>
    </div>
  </div>

  <button id="backTop" aria-label="الصعود للأعلى">↑</button>
  <div class="toasts"></div>

  <script src="config/data.js"></script>
  <script src="config/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/art.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
