<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دارك ستور — متجر شحن الألعاب</title>
  <meta name="description" content="دارك ستور — اشحن ألعابك المفضلة فوراً بأفضل الأسعار: PUBG، Free Fire، Mobile Legends، COD وأكثر.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <!-- الهيدر (يُبنى عبر js/ui.js) -->
  <div id="appHeader"></div>

  <main class="main-content">

    <!-- الهيرو -->
    <section class="hero" aria-label="Hero">
      <div class="container">
        <div class="hero-slider" id="slider">
          <button class="slider-arrow prev" aria-label="السابق">‹</button>
          <button class="slider-arrow next" aria-label="التالي">›</button>
          <div class="slider-dots"></div>
        </div>
      </div>
    </section>

    <!-- الثقة -->
    <section class="section" style="padding-top:30px" aria-label="لماذا نحن">
      <div class="container">
        <div class="trust-grid" id="trustGrid"></div>
      </div>
    </section>

    <!-- الألعاب -->
    <section class="section" id="games">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <span class="kick">🎮 <span data-i18n="nav.games"></span></span>
            <h2 data-i18n="games.title"></h2>
            <p class="sub" data-i18n="games.sub"></p>
          </div>
          <button class="link-all" id="showAllBtn" data-i18n="games.all">
            <span data-i18n="games.all"></span> <span class="arr"></span>
          </button>
        </div>
        <div class="cat-tabs" id="catTabs"></div>
        <div class="games-grid" id="gamesGrid"></div>
      </div>
    </section>

    <!-- عروض الفلاش -->
    <section class="section" id="flash">
      <div class="container">
        <div class="flash-head reveal">
          <div class="flash-title">
            <span class="bolt">⚡</span>
            <div>
              <h3 data-i18n="flash.title"></h3>
              <p data-i18n="flash.sub"></p>
            </div>
          </div>
          <div class="countdown" id="flashTimer" role="timer">
            <div><b id="tH">00</b><span data-i18n="flash.hours"></span></div>
            <div><b id="tM">00</b><span data-i18n="flash.mins"></span></div>
            <div><b id="tS">00</b><span data-i18n="flash.secs"></span></div>
          </div>
        </div>
        <div class="flash-grid" id="flashGrid"></div>
      </div>
    </section>

    <!-- شحن سريع -->
    <section class="section">
      <div class="container">
        <div class="widget reveal" id="topupWidget">
          <div class="widget-grid">
            <div class="widget-visual">
              <div class="wimg"><img src="https://picsum.photos/seed/widgetimg/600/400" alt="" loading="lazy" onerror="this.remove()"><span class="wemoji">🎮</span></div>
              <h3 data-i18n="widget.title"></h3>
              <p data-i18n="widget.sub"></p>
            </div>
            <div>
              <div class="field">
                <label for="widgetGame" data-i18n="widget.game"></label>
                <select class="select" id="widgetGame"></select>
              </div>
              <div class="field">
                <label for="widgetId" data-i18n="widget.player"></label>
                <input class="input" id="widgetId" type="text" autocomplete="off">
              </div>
              <div class="field">
                <label data-i18n="widget.pkg"></label>
                <div class="pkg-list" id="widgetPkgs"><span class="hint" data-i18n="widget.pkgPh"></span></div>
              </div>
              <button class="btn btn-primary btn-lg btn-block btn-glow" id="widgetBtn">⚡ <span data-i18n="widget.btn"></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ليه دارك ستور -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <span class="kick">⭐ <span data-i18n="why.title"></span></span>
            <h2 data-i18n="why.title"></h2>
            <p class="sub" data-i18n="why.sub"></p>
          </div>
        </div>
        <div class="why-grid reveal">
          <div class="why-card"><span class="wicon">🛡️</span><b data-i18n="why.1t"></b><p data-i18n="why.1d"></p></div>
          <div class="why-card"><span class="wicon">⚡</span><b data-i18n="why.2t"></b><p data-i18n="why.2d"></p></div>
          <div class="why-card"><span class="wicon">💳</span><b data-i18n="why.3t"></b><p data-i18n="why.3d"></p></div>
          <div class="why-card"><span class="wicon">🎧</span><b data-i18n="why.4t"></b><p data-i18n="why.4d"></p></div>
          <div class="why-card"><span class="wicon">💰</span><b data-i18n="why.5t"></b><p data-i18n="why.5d"></p></div>
        </div>
      </div>
    </section>

    <!-- كيف تعمل -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <span class="kick">🪜 <span data-i18n="how.title"></span></span>
            <h2 data-i18n="how.title"></h2>
            <p class="sub" data-i18n="how.sub"></p>
          </div>
        </div>
        <div class="steps reveal">
          <div class="step"><span class="snum">1</span><span class="sicon">🎮</span><b data-i18n="how.1t"></b><p data-i18n="how.1d"></p></div>
          <div class="step"><span class="snum">2</span><span class="sicon">📦</span><b data-i18n="how.2t"></b><p data-i18n="how.2d"></p></div>
          <div class="step"><span class="snum">3</span><span class="sicon">💳</span><b data-i18n="how.3t"></b><p data-i18n="how.3d"></p></div>
          <div class="step"><span class="snum">4</span><span class="sicon">📝</span><b data-i18n="how.4t"></b><p data-i18n="how.4d"></p></div>
          <div class="step"><span class="snum">5</span><span class="sicon">🚀</span><b data-i18n="how.5t"></b><p data-i18n="how.5d"></p></div>
        </div>
      </div>
    </section>

    <!-- الأخبار + FAQ -->
    <section class="section" id="news">
      <div class="container">
        <div class="news-grid reveal">
          <div>
            <div class="section-head" style="margin-bottom:20px">
              <div>
                <span class="kick">📰 <span data-i18n="news.title"></span></span>
                <h2 data-i18n="news.title"></h2>
              </div>
            </div>
            <div class="news-list" id="newsList"></div>
          </div>
          <div id="support">
            <div class="section-head" style="margin-bottom:20px">
              <div>
                <span class="kick">❓ <span data-i18n="faq.title"></span></span>
                <h2 data-i18n="faq.title"></h2>
                <p class="sub" data-i18n="faq.sub"></p>
              </div>
            </div>
            <div id="faqList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="section">
      <div class="container">
        <div class="cta-banner reveal">
          <h2 data-i18n="hero.titleB"></h2>
          <p data-i18n="hero.s2.sub"></p>
          <a href="#topupWidget" class="btn btn-lg" data-i18n="hero.cta"></a>
        </div>
      </div>
    </section>

  </main>

  <!-- الفوتر (يُبنى عبر js/ui.js) -->
  <div id="appFooter"></div>

  <!-- السلة -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="السلة">
    <div class="drawer-head"><h3>🛒 <span data-i18n="cart.title"></span></h3><button class="btn-icon modal-close" onclick="closeCart()" aria-label="إغلاق">✕</button></div>
    <div class="drawer-body"></div>
    <div class="drawer-foot"></div>
  </aside>

  <!-- مودال دخول الإدارة -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal admin-login-card">
      <button class="btn-icon modal-close" data-close="adminModal" aria-label="إغلاق">✕</button>
      <span class="lock">🛡️</span>
      <h1 data-i18n="a.login"></h1>
      <p data-i18n="a.loginSub"></p>
      <div class="field">
        <label for="adminPassInput" data-i18n="a.password"></label>
        <input class="input" id="adminPassInput" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="adminLoginBtn" data-i18n="a.enter"></button>
    </div>
  </div>

  <button id="backTop" aria-label="الصعود للأعلى">↑</button>
  <div class="toasts"></div>

  <script src="config/data.js"></script>
  <script src="config/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
