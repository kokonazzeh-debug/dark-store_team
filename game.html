<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دارك ستور — باقات وعروض الألعاب</title>
  <meta name="description" content="صفحة كل لعبة في دارك ستور — كل الباقات والأسعار والعروض والخصومات بكل تفاصيلها مع شحن فوري.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="game">

  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container">

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a> /
        <a href="index.html#games" data-i18n="nav.games"></a> /
        <span id="gxCrumb"></span>
      </nav>

      <!-- الهيرو الخاص باللعبة -->
      <section class="gx-hero reveal" id="gxHero">
        <div class="gx-hero-media">
          <img class="gx-hero-img" id="gxHeroImg" src="" alt="" onerror="imgOnError(this, '')">
          <div class="gx-hero-art" id="gxHeroArt"></div>
          <div class="gx-badge" id="gxHeroBadge"></div>
        </div>
        <div class="gx-hero-info">
          <span class="gx-kick" id="gxKick"></span>
          <h1 id="gxTitle"></h1>
          <p class="gx-desc" id="gxDesc"></p>
          <div class="gx-meta">
            <span class="stars" id="gxStars"></span>
            <span id="gxPlayers"></span>
            <span class="prod-cat" id="gxCat"></span>
          </div>
          <div class="gx-servers" id="gxServers"></div>
          <div class="gx-actions">
            <a href="#gxBuy" class="btn btn-primary btn-lg btn-glow" id="gxCta">⚡ <span data-i18n="gx.cta"></span></a>
            <a href="#gxPkgs" class="btn btn-ghost btn-lg" id="gxPkgsBtn"><span data-i18n="gx.pkgs"></span></a>
            <button class="btn btn-ghost btn-lg" id="gxFav">♡</button>
            <a href="product.html?game=X" class="btn btn-ghost btn-lg gx-quick" id="gxQuick"><span data-i18n="gx.quick"></span></a>
          </div>
        </div>
      </section>

      <!-- إحصائيات سريعة -->
      <section class="gx-stats reveal" id="gxStats"></section>

      <!-- كل الباقات والأسعار -->
      <section class="section" id="gxPkgs">
        <div class="section-head reveal">
          <div>
            <span class="kick">📦 <span data-i18n="gx.pkgs"></span></span>
            <h2 data-i18n="gx.pkgs"></h2>
            <p class="sub" data-i18n="gx.pkgsSub"></p>
          </div>
        </div>
        <div class="gx-pkgs" id="gxPkgsGrid"></div>
      </section>

      <!-- عروض اللعبة -->
      <section class="section" id="gxOffers">
        <div class="section-head reveal">
          <div>
            <span class="kick">⚡ <span data-i18n="gx.offers"></span></span>
            <h2 data-i18n="gx.offers"></h2>
            <p class="sub" data-i18n="gx.offersSub"></p>
          </div>
        </div>
        <div class="gx-offers" id="gxOffersGrid"></div>
      </section>

      <!-- الشحن السريع -->
      <section class="section" id="gxBuy">
        <div class="container-inner">
          <div class="widget reveal">
            <div class="widget-grid">
              <div class="widget-visual">
                <div class="wimg"><img id="gxWimg" src="" alt=""><span class="wemoji" id="gxWemoji">🎮</span></div>
                <h3 id="gxWtitle"></h3>
                <p data-i18n="widget.sub"></p>
              </div>
              <div>
                <div class="field">
                  <label data-i18n="product.pkg"></label>
                  <div class="pkg-list" id="gxBuyPkgs"></div>
                </div>
                <div class="field" id="gxServerField" style="display:none">
                  <label for="gxServer" data-i18n="product.server"></label>
                  <select class="select" id="gxServer"></select>
                </div>
                <div class="field">
                  <label for="gxPlayerId" data-i18n="product.playerId"></label>
                  <input class="input" id="gxPlayerId" type="text" autocomplete="off">
                </div>
                <div class="player-lookup" id="gxLookup" hidden></div>
                <div class="field">
                  <label data-i18n="product.qty"></label>
                  <div class="qty-stepper">
                    <button type="button" data-q="-1" aria-label="−">−</button>
                    <span>1</span>
                    <button type="button" data-q="1" aria-label="+">+</button>
                  </div>
                </div>
                <div class="gx-buy-actions">
                  <button class="btn btn-primary btn-lg btn-glow" id="gxBuyNow">⚡ <span data-i18n="gx.buyNow"></span></button>
                  <button class="btn btn-ghost btn-lg" id="gxAddCart">🛒 <span data-i18n="gx.addCart"></span></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- طريقة الشحن -->
      <section class="section" id="gxHow">
        <div class="section-head reveal">
          <div>
            <span class="kick">🪜 <span data-i18n="gx.how"></span></span>
            <h2 data-i18n="gx.how"></h2>
            <p class="sub" data-i18n="gx.howSub"></p>
          </div>
        </div>
        <div class="steps reveal" id="gxSteps"></div>
      </section>

      <!-- التقييمات -->
      <section class="section" id="gxReviews">
        <div class="section-head reveal">
          <div>
            <span class="kick">⭐ <span data-i18n="gx.reviews"></span></span>
            <h2 data-i18n="gx.reviews"></h2>
          </div>
        </div>
        <div id="gxReviewsList"></div>
        <div class="review-form" id="gxReviewForm">
          <h3 data-i18n="product.writeReview"></h3>
          <div class="stars-input" id="gxRvStars" dir="ltr">
            <button data-v="1" aria-label="1">★</button>
            <button data-v="2" aria-label="2">★</button>
            <button data-v="3" aria-label="3">★</button>
            <button data-v="4" aria-label="4">★</button>
            <button data-v="5" aria-label="5">★</button>
          </div>
          <div class="field-row" style="margin:16px 0">
            <div class="field">
              <label for="gxRvName" data-i18n="product.yourName"></label>
              <input class="input" id="gxRvName" type="text" autocomplete="name">
            </div>
            <div class="field">
              <label for="gxRvText" data-i18n="product.yourText"></label>
              <input class="input" id="gxRvText" type="text">
            </div>
          </div>
          <button class="btn btn-primary" id="gxRvSend" data-i18n="product.sendReview"></button>
        </div>
      </section>

      <!-- ألعاب مشابهة -->
      <section class="section" id="gxRelated">
        <div class="section-head reveal">
          <div>
            <span class="kick">🎮 <span data-i18n="gx.related"></span></span>
            <h2 data-i18n="gx.related"></h2>
          </div>
        </div>
        <div class="games-grid" id="gxRelatedGrid"></div>
      </section>

    </div>
  </main>

  <div id="appFooter"></div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="السلة">
    <div class="drawer-head"><h3>🛒 <span data-i18n="cart.title"></span></h3><button class="btn-icon modal-close" onclick="closeCart()" aria-label="إغلاق">✕</button></div>
    <div class="drawer-body"></div>
    <div class="drawer-foot"></div>
  </aside>

  <div class="modal-backdrop" id="adminModal">
    <div class="modal admin-login-card">
      <button class="btn-icon modal-close" data-close="adminModal" aria-label="إغلاق">✕</button>
      <span class="lock">🛡️</span>
      <h1 data-i18n="a.login"></h1>
      <p data-i18n="a.loginSub"></p>
      <div class="field">
        <label for="adminPassInput" data-i18n="a.password"></label>
        <input class="input" id="adminPassInput" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="adminLoginBtn" data-i18n="a.enter"></button>
    </div>
  </div>

  <button id="backTop" aria-label="الصعود للأعلى">↑</button>
  <div class="toasts"></div>

  <script src="config/data.js"></script>
  <script src="config/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/art.js"></script>
  <script src="js/lookup.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
