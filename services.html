<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دارك ستور — الخدمات البرمجية</title>
  <meta name="description" content="الخدمات البرمجية في دارك ستور — تطوير مواقع، متاجر إلكترونية، بوتات، تطبيقات موبايل، سكريبتات وتصميم واجهات UI/UX بجودة احترافية.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services">

  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container">

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a> /
        <span data-i18n="nav.services"></span>
      </nav>

      <!-- هيرو برمجي سينمائي -->
      <section class="sv-hero reveal">
        <div class="sv-hero-bg" id="svHeroBg"></div>
        <div class="sv-hero-grid">
          <div class="sv-hero-content">
            <span class="sv-hero-kick">🚀 <span data-i18n="sv.title"></span></span>
            <h1 data-i18n="sv.heroTitle"></h1>
            <p data-i18n="sv.heroSub"></p>
            <div class="sv-hero-actions">
              <a href="#servicesGrid" class="btn btn-primary btn-lg btn-glow">⚡ <span data-i18n="sv.heroCta"></span></a>
              <a href="#svSteps" class="btn btn-ghost btn-lg"><span data-i18n="sv.heroCta2"></span></a>
            </div>
          </div>
          <div class="sv-code" dir="ltr" aria-hidden="true">
            <div class="sv-code-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><b>dark-store.js</b></div>
            <div class="sv-code-body">
              <p><i>1</i><span class="cm">// مشروعك جاهز للانطلاق</span></p>
              <p><i>2</i><span class="kw">import</span> { <span class="fn">DarkStore</span> } <span class="kw">from</span> <span class="str">'@dev/studio'</span>;</p>
              <p><i>3</i></p>
              <p><i>4</i><span class="kw">const</span> project = <span class="kw">new</span> <span class="fn">DarkStore</span>();</p>
              <p><i>5</i>project.<span class="fn">build</span>({</p>
              <p><i>6</i>&nbsp;&nbsp;type: <span class="str">'site + bot'</span>,</p>
              <p><i>7</i>&nbsp;&nbsp;speed: <span class="num">'fast'</span>,</p>
              <p><i>8</i>&nbsp;&nbsp;warranty: <span class="num">true</span>,</p>
              <p><i>9</i>});</p>
              <p><i>10</i><span class="kw">await</span> project.<span class="fn">launch</span>(); <span class="cm">// 🚀</span></p>
            </div>
          </div>
        </div>
        <div class="sv-hero-stats">
          <div class="sv-hstat"><b id="svStatProjects">120+</b><span data-i18n="sv.stat.projects"></span></div>
          <div class="sv-hstat"><b id="svStatDays">7<span>/</span>24</b><span data-i18n="sv.stat.days"></span></div>
          <div class="sv-hstat"><b id="svStatRate">98<span>%</span></b><span data-i18n="sv.stat.rate"></span></div>
        </div>
      </section>

      <!-- لماذا نحن -->
      <section class="sv-trust reveal" id="svTrust"></section>

      <!-- الخدمات -->
      <section class="section" id="servicesGrid" style="padding-top:10px">
        <div class="section-head reveal">
          <div>
            <span class="kick">🛠️ <span data-i18n="sv.title"></span></span>
            <h2 data-i18n="sv.title"></h2>
            <p class="sub" data-i18n="sv.sub"></p>
          </div>
        </div>
        <div class="services-grid" id="servicesGridBox"></div>
      </section>

      <!-- التقنيات -->
      <section class="section" id="svTechSec">
        <div class="section-head reveal">
          <div>
            <span class="kick">💻 <span data-i18n="sv.tech"></span></span>
            <h2 data-i18n="sv.tech"></h2>
            <p class="sub" data-i18n="sv.techSub"></p>
          </div>
        </div>
        <div class="sv-tech reveal" id="svTech"></div>
      </section>

      <!-- كيف نعمل -->
      <section class="section" id="svStepsSec">
        <div class="section-head reveal">
          <div>
            <span class="kick">⚙️ <span data-i18n="sv.how.t"></span></span>
            <h2 data-i18n="sv.how.t"></h2>
            <p class="sub" data-i18n="sv.how.sub"></p>
          </div>
        </div>
        <div class="steps reveal" id="svSteps"></div>
      </section>

      <!-- أسئلة شائعة -->
      <section class="section" id="svFaqSec">
        <div class="section-head reveal">
          <div>
            <span class="kick">❓ <span data-i18n="sv.faq.t"></span></span>
            <h2 data-i18n="sv.faq.t"></h2>
            <p class="sub" data-i18n="sv.faq.sub"></p>
          </div>
        </div>
        <div id="svFaq" class="faq-list"></div>
      </section>

      <!-- CTA -->
      <section class="cta-banner reveal" style="margin-top:10px">
        <h2 data-i18n="sv.need"></h2>
        <p data-i18n="sv.needD"></p>
        <a href="tickets.html" class="btn btn-lg btn-glow" data-i18n="sv.contact"></a>
      </section>

    </div>
  </main>

  <div id="appFooter"></div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="السلة">
    <div class="drawer-head"><h3>🛒 <span data-i18n="cart.title"></span></h3><button class="btn-icon modal-close" onclick="closeCart()" aria-label="إغلاق">✕</button></div>
    <div class="drawer-body"></div>
    <div class="drawer-foot"></div>
  </aside>

  <div class="modal-backdrop" id="adminModal">
    <div class="modal admin-login-card">
      <button class="btn-icon modal-close" data-close="adminModal" aria-label="إغلاق">✕</button>
      <span class="lock">🛡️</span>
      <h1 data-i18n="a.login"></h1>
      <p data-i18n="a.loginSub"></p>
      <div class="field">
        <label for="adminPassInput" data-i18n="a.password"></label>
        <input class="input" id="adminPassInput" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="adminLoginBtn" data-i18n="a.enter"></button>
    </div>
  </div>

  <button id="backTop" aria-label="الصعود للأعلى">↑</button>
  <div class="toasts"></div>

  <script src="config/data.js"></script>
  <script src="config/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/art.js"></script>
  <script src="js/services.js"></script>
</body>
</html>
